services:
  backend:
    container_name: backend
    build: ./Backend
    volumes:
      - ./Backend:/Backend_app  
    ports:
      - "8000:8000"
      
  frontend:
    container_name: frontend
    build: ./Frontend
    depends_on:
      - backend
    volumes:
      - ./Frontend:/usr/share/nginx/html  
    ports:
      - "80:80"  