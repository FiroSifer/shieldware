<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PC MONITORING DASHBOARD</title>
        <link rel="stylesheet" href="static/style.css">
    </head>
    <body>
        <h1>PC Monitoring</h1>
        <div class="dashboard">
            <div  class="card">
                <h2 class="card_name">CPU</h2>
                <p id="cpu_usage" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">GPU</h2>
                <p id="gpu_usage" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">RAM</h2>
                <p id="ram_usage" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">TEMP</h2>
                <p id="sys_temp" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">NETs</h2>
                <p id="net_sent" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">NETr</h2>
                <p id="net_rec" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">DISK</h2>
                <p id="disk_usage" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">DISKs</h2>
                <p id="disk_sent" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">DISKr</h2>
                <p id="disk_rec" class="card_value">0%</p>
            </div>
            <div  class="card">
                <h2 class="card_name">PIDS</h2>
                <p id="pids" class="card_value">0%</p>
            </div>
        </div>
        <script src="static/script.js"></script>
    </body>
</html>
