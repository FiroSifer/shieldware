<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PC MONITORING DASHBOARD</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>PC Monitoring</h1>
        <div class="dashboard">
            <div  class="card">
                <h2>CPU</h2>
                <p id="cpu_usage">0%</p>
            </div>
            <div  class="card">
                <h2>GPU</h2>
                <p id="gpu_usage">0%</p>
            </div>
            <div  class="card">
                <h2>RAM</h2>
                <p id="ram_usage">0%</p>
            </div>
            <div  class="card">
                <h2>TEMPERATURE</h2>
                <p id="sys_temp">0%</p>
            </div>
            <div  class="card">
                <h2>NETWORK SENT</h2>
                <p id="net_sent">0%</p>
            </div>
            <div  class="card">
                <h2>NETWORK RECEIVED</h2>
                <p id="net_rec">0%</p>
            </div>
            <div  class="card">
                <h2>DISK USAGE</h2>
                <p id="disk_usage">0%</p>
            </div>
            <div  class="card">
                <h2>DISK INFORMATION SENT</h2>
                <p id="disk_sent">0%</p>
            </div>
            <div  class="card">
                <h2>DISK INFORMATION RECEIVED</h2>
                <p id="disk_rec">0%</p>
            </div>
            <div  class="card">
                <h2>CURRENT PIDS</h2>
                <p id="pids">0%</p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
